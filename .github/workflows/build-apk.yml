name: Build SUNO APK

on:
  push:
    branches:
      - main
      - feat/integration
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Align tflite_flutter JVM target
        run: |
          TFLITE_GRADLE="$(find "$PUB_CACHE" -path '*/tflite_flutter-0.12.1/android/build.gradle' -print -quit)"
          test -n "$TFLITE_GRADLE"
          sed -i 's/JavaVersion.VERSION_11/JavaVersion.VERSION_17/g' "$TFLITE_GRADLE"
          grep -n 'Compatibility' "$TFLITE_GRADLE"

      - name: Align vibration plugin compileSdk
        run: |
          # The vibration plugin's android module pins compileSdk 33, but the
          # androidx artifacts it depends on require 34+, which fails
          # assembleRelease. Bump it for every matching plugin module.
          matched=0
          for f in $(find "$PUB_CACHE" -path '*vibration*' -path '*/android/*' \
                       \( -name 'build.gradle' -o -name 'build.gradle.kts' \)); do
            sed -i -E 's/(compileSdkVersion|compileSdk)([[:space:]]*=[[:space:]]*| )3[0-9]/\1\2 36/' "$f"
            echo "--- $f"
            grep -nE 'compileSdk' "$f"
            matched=1
          done
          if [ "$matched" -ne 1 ]; then
            echo "::error::No vibration plugin android build file found in \$PUB_CACHE."
            exit 1
          fi

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        run: flutter test

      - name: Build release APK
        env:
          ORG_GRADLE_PROJECT_sunoTfliteJava17: 'true'
          SUNO_RELAY_AUTH_KEY: ${{ secrets.SUNO_RELAY_AUTH_KEY }}
          MAPTILER_KEY: ${{ secrets.MAPTILER_KEY }}
        run: |
          if [ -z "$SUNO_RELAY_AUTH_KEY" ]; then
            echo "::error::GitHub Actions secret SUNO_RELAY_AUTH_KEY is not configured."
            exit 1
          fi
          if [ -z "$MAPTILER_KEY" ]; then
            echo "::warning::GitHub Actions secret MAPTILER_KEY is not configured. The map preview falls back to the rate-limited public OSM tile server."
          fi
          flutter build apk --release \
          --dart-define=SUNO_ALERT_RELAY_URL=https://uxqthxlgcyybbrpmfevk.supabase.co/functions/v1/send-alert \
          --dart-define="SUNO_RELAY_AUTH_KEY=$SUNO_RELAY_AUTH_KEY" \
          --dart-define="MAPTILER_KEY=$MAPTILER_KEY"

      - name: Prepare final APK
        run: cp build/app/outputs/flutter-apk/app-release.apk SUNO-final.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SUNO-final-apk
          path: SUNO-final.apk
          if-no-files-found: error
          retention-days: 30
