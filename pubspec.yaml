name: suno_ai
description: "SUNO — a local-first AI safety companion hackathon prototype."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  tflite_flutter: ^0.12.1
  record: ^5.1.2
  flutter_map: ^6.1.0
  latlong2: ^0.9.0
  geolocator: ^12.0.0
  sensors_plus: ^6.1.1
  permission_handler: ^11.3.1
  hive_flutter: ^1.1.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.4
  uuid: ^4.4.2
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/ml/suno_audio_classifier.tflite
    - assets/ml/labels.json
    - assets/ml/yamnet.tflite
